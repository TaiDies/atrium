name: atrium

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atrium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atrium}
      POSTGRES_DB: ${POSTGRES_DB:-atrium}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    # Built here by default. To use a ready-made release instead, set ATRIUM_IMAGE (for example
    # ghcr.io/taidies/atrium:1.8.1) and run: docker compose pull app && docker compose up -d --no-build
    image: ${ATRIUM_IMAGE:-atrium:latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-atrium}:${POSTGRES_PASSWORD:-atrium}@postgres:5432/${POSTGRES_DB:-atrium}
      # Set to "true" when the app is served over HTTPS.
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      PUBLIC_URL: ${PUBLIC_URL:-}
      ALLOW_PRIVATE_URLS: ${ALLOW_PRIVATE_URLS:-true}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
      MAX_IMPORT_MB: ${MAX_IMPORT_MB:-1024}
      # Time zone for "today" (repeating tasks reset at midnight here), e.g. Europe/London.
      TZ: ${TZ:-UTC}
      # How many document conversions (LibreOffice) run at once.
      CONVERT_PARALLEL: ${CONVERT_PARALLEL:-2}
      # Email (optional): sign-in codes. See .env.example.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      MAIL_FROM: ${MAIL_FROM:-}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      APP_NAME: ${APP_NAME:-Atrium}
      # Meetings: STUN/TURN servers as JSON, e.g. [{"urls":"turn:turn.example.com:3478","username":"u","credential":"p"}]
      RTC_ICE_SERVERS: ${RTC_ICE_SERVERS:-}
      # Admin panel (its own port). Without ADMIN_PASSWORD, one is printed in the log on first start.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PANEL: ${ADMIN_PANEL:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Where new versions are looked for (GitHub owner/repo); the admin panel shows and can install them.
      UPDATE_REPO: ${UPDATE_REPO:-TaiDies/atrium}
    ports:
      - "${APP_PORT:-3000}:3000"
      # The admin panel is only opened on this machine (use an SSH tunnel or VPN to reach it).
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    volumes:
      - data:/data

  # Installs new versions for the admin panel's "Update now" and auto-update: pulls the new version
  # into this folder and rebuilds the app (tools/updater.sh). It needs the Docker socket, so it can
  # control Docker on this machine — remove this service if you'd rather update by hand.
  # Optional automatic updates. It controls Docker on this machine, so it only runs when you choose it:
  #   docker compose --profile updater up -d
  # It installs published releases only (the release's git tag), never unreleased code.
  updater:
    image: docker:27-cli
    profiles: ["updater"]
    restart: unless-stopped
    working_dir: /project
    entrypoint: ["sh", "/project/tools/updater.sh"]
    environment:
      UPDATE_REPO: ${UPDATE_REPO:-TaiDies/atrium}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/project
      - data:/data

volumes:
  db:
  data:
