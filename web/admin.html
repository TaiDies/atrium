<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Admin panel</title>
    <script>
      try {
        // Saved settings were named "af-..." before 1.9.0: move them to their new "atrium-..." names once.
        [localStorage, sessionStorage].forEach(function (s) {
          var old = [];
          for (var i = 0; i < s.length; i++) if (/^af-/.test(s.key(i))) old.push(s.key(i));
          old.forEach(function (k) {
            var n = 'atrium-' + k.slice(3);
            if (s.getItem(n) === null) s.setItem(n, s.getItem(k));
            s.removeItem(k);
          });
        });
        var t = localStorage.getItem('atrium-theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.dataset.color = 'default';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
