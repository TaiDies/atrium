<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Atrium</title>
    <script>
      // Whiteboard fonts are served by this app (see vite.config.ts), not a CDN.
      window.EXCALIDRAW_ASSET_PATH = '/excalidraw-assets/';
      try {
        var t = localStorage.getItem('af-theme') || 'system';
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
        document.documentElement.dataset.color = localStorage.getItem('af-color-theme') || 'default';
        var d = document.documentElement.dataset;
        d.font = localStorage.getItem('af-font') || 'sans';
        d.size = localStorage.getItem('af-text-size') || 'default';
        d.width = localStorage.getItem('af-page-width') || 'default';
        d.density = localStorage.getItem('af-density') || 'comfortable';
        var cc = JSON.parse(localStorage.getItem('af-custom-colors') || 'null');
        var own = cc && cc[document.documentElement.classList.contains('dark') ? 'dark' : 'light'];
        if (own) for (var k in own) if (/^[a-z]+$/.test(k) && /^#[0-9a-f]{6}$/i.test(own[k])) document.documentElement.style.setProperty('--' + k, own[k]);
        var a = localStorage.getItem('af-accent');
        if (a && /^#[0-9a-f]{6}$/i.test(a)) {
          document.documentElement.style.setProperty('--custom-accent', a);
          document.documentElement.setAttribute('data-custom-accent', '');
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
