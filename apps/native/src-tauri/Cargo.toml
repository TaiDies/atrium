[package]
name = "workspace-native"
version = "1.0.0"
description = "The Windows and Android apps: the web app, working offline, connected to a server of your choice"
edition = "2021"

[lib]
name = "workspace_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rustls rather than OpenSSL, so the same code builds for Windows and Android.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tauri-plugin-notification = "2"

# Updates for the Windows app, from the GitHub releases (signed; see tauri.conf.json).
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
